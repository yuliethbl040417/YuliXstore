<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YuliXstore · Administración</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0610;color:#fff;font-family:Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px}.card{background:#160c20;border:1px solid #432153;border-radius:18px;padding:18px;margin-bottom:18px;box-shadow:0 12px 35px #0006}h1,h2{margin:0 0 14px}.muted{color:#b9a9c2}.row{display:flex;gap:10px;flex-wrap:wrap}input,button,select{border-radius:12px;border:1px solid #58306c;background:#100916;color:#fff;padding:12px}input{width:100%}button{cursor:pointer;font-weight:700}button.primary{background:#8c36b7;border-color:#a74bd3}.login{max-width:430px;margin:8vh auto}.hidden{display:none}.order{border:1px solid #352040;border-radius:14px;padding:14px;margin:10px 0;background:#100916}.ordergrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#291333;font-size:12px}.ok{border-color:#3b8d62}.bad{border-color:#8c3c50}.actions{margin-top:12px}.actions button{margin:3px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.danger{border-color:#713047}.receipt{display:inline-block;margin-top:8px;color:#d891ff}.stat{font-size:20px;font-weight:800}.small{font-size:13px}
</style></head><body><main>
<section id="login" class="card login"><h1>YuliXstore Admin</h1><p class="muted">Acceso privado para administrar pedidos.</p><input id="email" type="email" placeholder="Correo del administrador"><br><br><input id="password" type="password" placeholder="Contraseña"><br><br><button class="primary" id="loginBtn">Iniciar sesión</button><button id="setupBtn">Configurar administrador por primera vez</button><p id="loginMsg" class="muted"></p><div id="setupBox" class="hidden"><hr><p class="muted">Solo funciona si todavía no existe ningún administrador.</p><input id="setupEmail" type="email" placeholder="Correo del administrador"><br><br><input id="setupPassword" type="password" placeholder="Contraseña (mínimo 12 caracteres)"><br><br><button class="primary" id="createAdminBtn">Crear administrador</button><p id="setupMsg" class="muted"></p></div></section>
<section id="app" class="hidden"><div class="top"><div><h1>Panel de administración</h1><p class="muted">Pagos manuales · JADH · pedidos</p></div><div class="row"><button id="refresh">Actualizar</button><button id="balance">Consultar saldo JADH</button><button id="logout">Cerrar sesión</button></div></div>
<div class="card"><div class="row"><div><span class="muted">Pedidos visibles</span><div id="count" class="stat">0</div></div><div><span class="muted">Pendientes de pago</span><div id="pending" class="stat">0</div></div><div><span class="muted">Procesando JADH</span><div id="processing" class="stat">0</div></div></div><p id="balanceMsg" class="muted"></p></div>
<div class="card"><div class="top"><h2>Pedidos</h2><select id="filter"><option value="ALL">Todos</option><option value="PENDING">Pago pendiente</option><option value="APPROVED">Pago aprobado</option><option value="PROCESSING">Recarga en proceso</option><option value="COMPLETED">Recarga completada</option><option value="FAILED">Recarga fallida</option></select></div><div id="orders">Cargando…</div></div></section>
</main><script>
const API=window.YULIXSTORE_API||'https://yulixtore-backend.onrender.com';let token=localStorage.getItem('yx_admin_token')||'';let orders=[];const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function authHeaders(){return {'Content-Type':'application/json',Authorization:'Bearer '+token}}
$('setupBtn').onclick=()=>{$('setupBox').classList.toggle('hidden')};
$('createAdminBtn').onclick=async()=>{try{const email=$('setupEmail').value.trim();const password=$('setupPassword').value;const r=await fetch(API+'/api/admin/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo crear el administrador.');$('setupMsg').textContent='Administrador creado. Ya puedes iniciar sesión.';$('setupBox').classList.add('hidden');$('email').value=email;}catch(e){$('setupMsg').textContent=e.message}};
function showApp(){ $('login').classList.toggle('hidden',!!token);$('app').classList.toggle('hidden',!token);if(token)load() }
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{...authHeaders(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Error del servidor');return d}
$('loginBtn').onclick=async()=>{try{const d=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})}).then(async r=>{const x=await r.json();if(!r.ok)throw new Error(x.error||'Credenciales incorrectas');return x});token=d.token;localStorage.setItem('yx_admin_token',token);$('loginMsg').textContent='';showApp()}catch(e){$('loginMsg').textContent=e.message}};
$('logout').onclick=()=>{token='';localStorage.removeItem('yx_admin_token');showApp()};$('refresh').onclick=load;$('filter').onchange=render;
async function load(){try{orders=await api('/api/admin/orders');$('count').textContent=orders.length;$('pending').textContent=orders.filter(o=>o.payment_status==='PENDING'||o.payment_status==='UNDER_REVIEW').length;$('processing').textContent=orders.filter(o=>o.topup_status==='PROCESSING').length;render()}catch(e){if(/sesión|autorizado|inválida/i.test(e.message)){token='';localStorage.removeItem('yx_admin_token');showApp()}else $('orders').innerHTML='<p class="muted">'+esc(e.message)+'</p>'}}
function paymentLabel(v){return ({PENDING:'Pago pendiente',APPROVED:'Pago aprobado',REJECTED:'Pago rechazado',UNDER_REVIEW:'Pago en revisión'})[String(v||'').toUpperCase()]||'—'} function topupLabel(v){return ({NOT_SENT:'Pendiente de envío',QUEUED:'En cola',PROCESSING:'Recarga en proceso',COMPLETED:'Recarga completada',FAILED:'Recarga fallida'})[String(v||'').toUpperCase()]||'—'}
function render(){const f=$('filter').value;let a=orders.filter(o=>f==='ALL'||(f==='PENDING'?(o.payment_status==='PENDING'||o.payment_status==='UNDER_REVIEW'):f==='APPROVED'?o.payment_status==='APPROVED':f===o.topup_status));$('orders').innerHTML=a.map(o=>{const approved=o.payment_status==='APPROVED',done=o.topup_status==='COMPLETED',processing=o.topup_status==='PROCESSING';return `<article class="order"><div class="top"><strong>${esc(o.order_number)}</strong><span class="badge">${esc(paymentLabel(o.payment_status))}</span><span class="badge">${esc(topupLabel(o.topup_status))}</span></div><div class="ordergrid"><span>💎 ${Number(o.product_diamonds||0).toLocaleString('es-CO')}</span><span>💰 $${Number(o.amount_cop||0).toLocaleString('es-CO')}</span><span>ID: ${esc(o.player_id)}</span><span>Cliente: ${esc(o.payer_name||'—')}</span><span>Tel: ${esc(o.payer_phone||'—')}</span><span>Método: ${esc(o.payment_method||'—')}</span><span>JADH: ${esc(o.provider_order_id||'—')}</span><span>Estado del proveedor: ${esc(o.provider_status||'—')}</span></div>${o.receipt_url?`<a class="receipt" href="${esc(o.receipt_url)}" target="_blank" rel="noopener">Ver comprobante</a>`:''}<div class="actions">${!approved?`<button class="primary" onclick="setPayment('${esc(o.order_number)}','APPROVED')">Aprobar pago</button><button class="danger" onclick="setPayment('${esc(o.order_number)}','REJECTED')">Rechazar</button>`:''}${approved&&!done?`<button onclick="refreshJadh('${esc(o.order_number)}')">Actualizar JADH</button>`:''}${approved&&o.topup_status==='FAILED'?`<button class="primary" onclick="sendJadh('${esc(o.order_number)}')">Reintentar JADH</button>`:''}</div></article>`}).join('')||'<p class="muted">No hay pedidos con este filtro.</p>'}
async function setPayment(n,status){if(!confirm(status==='APPROVED'?'¿Aprobar el pago y enviar la recarga a JADH?':'¿Rechazar este pago?'))return;try{await api('/api/admin/orders/'+encodeURIComponent(n)+'/payment',{method:'PATCH',body:JSON.stringify({status})});await load()}catch(e){alert(e.message);await load()}}
async function refreshJadh(n){try{await api('/api/admin/orders/'+encodeURIComponent(n)+'/refresh-jadh',{method:'POST'});await load()}catch(e){alert(e.message)}}
async function sendJadh(n){if(!confirm('¿Reintentar el envío a JADH?'))return;try{await api('/api/admin/orders/'+encodeURIComponent(n)+'/send-jadh',{method:'POST'});await load()}catch(e){alert(e.message);await load()}}
$('balance').onclick=async()=>{try{const d=await api('/api/admin/jadh/balance');$('balanceMsg').textContent='Saldo JADH consultado correctamente.'}catch(e){$('balanceMsg').textContent=e.message}};
showApp();
</script></body></html>
