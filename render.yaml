services:
  - type: web
    name: yulixtore-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yulixtore-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGINS
        sync: false
      - key: JADH_API_KEY
        sync: false
      - key: JADH_BASE_URL
        value: https://jadh.co/api/v1
      - key: SIXOFIRE_API_KEY
        sync: false
      - key: SIXOFIRE_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: yulixtore-db
    plan: free
